<!DOCTYPE html>
<html lang="en">
<head>
    <title>YouTube Music Widget</title>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="#" />
    <!-- The Inter build Figma uses (Google Fonts serves a newer one whose letter widths differ) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@4.5.15/500.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@4.5.15/600.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@4.5.15/700.css">
    <link rel="stylesheet" href="./style.css?v=4" />
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Main Music Player -->
    <div id="mainContainer">
        <!-- The stand (?stand=1): the stall, its hanging sign (laid out by sign.js)
             and the counter the card sits in. Hidden without the stand. -->
        <img class="stall" src="assets/stall.svg" alt="" />
        <svg class="sign" width="733" height="841" viewBox="0 0 733 841" aria-hidden="true">
            <line id="hangL" />
            <line id="hangR" />
            <rect id="signBox" rx="8" />
            <text id="signText" text-anchor="middle"></text>
        </svg>
        <div class="counter"></div>

        <!-- Main wrapper imitating your chat box structure -->
        <div class="sub-card-wrapper">
            <!-- Boiling border canvas behind the content -->
            <canvas class="sub-border-canvas"></canvas>

            <!-- Pure HTML/CSS Content Layout -->
            <div class="sub-card-content">
                <img id="albumArt" class="album-art" src="" alt="Album Art" />

                <div class="info-area">
                    <!-- Two copies per line for the seamless smooth-wrap marquee
                         (ported from the Music Card). JS fills both .mq-copy spans. -->
                    <div class="title-wrapper">
                        <div id="trackTitle" class="title">
                            <span class="mq-copy"></span><span class="mq-copy" aria-hidden="true"></span>
                        </div>
                    </div>
                    <div class="artist-wrapper">
                        <div id="trackArtist" class="artist">
                            <span class="mq-copy"></span><span class="mq-copy" aria-hidden="true"></span>
                        </div>
                    </div>

                    <div class="progress-area">
                        <span id="timeCurrent" class="time">0:00</span>
                        <div class="progress-bar-container" id="progressContainer">
                            <!-- Inline SVG for the Sine Wave -->
                            <svg id="progressSvg" height="16">
                                <path id="progressPath" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <div id="progressThumb" class="progress-thumb"></div>
                        </div>
                        <span id="timeRemaining" class="time">-0:00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Setup / Authorization Popup -->
    <div id="setupContainer" style="display: none;">
        <div id="authorizationBox">
            <h2>Authentication Needed</h2>
            <p style="margin-bottom: 20px;">Enter this code in YTMDesktop:</p>
            <div id="authorizationCode">----</div>
            <div id="authorizationComplete">
                <p style="margin-bottom: 20px;">Authorization Successful!</p>
            </div>
            <button id="copyURLButton" disabled onclick="CopyToURL()">Waiting for approval...</button>
        </div>

        <div id="errorBox">
            <div id="errorCode">Error</div>
            <div id="errorMessage">Could not connect to YTMDesktop.</div>
            <button id="closeErrorBox" onclick="CloseErrorBox()">Okay</button>
        </div>
    </div>

    <script src="./sign.js?v=3"></script>
    <script src="./script.js?v=4"></script>
</body>
</html>
